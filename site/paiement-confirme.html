<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bienvenue dans le programme — Périnéa</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">
  <!--
    Page de retour après paiement. Dans Stripe : Payment Link → Après le paiement →
    « Rediriger vers votre site » → https://<domaine>/paiement-confirme.html?session_id={CHECKOUT_SESSION_ID}
  -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    var c = null; try { c = localStorage.getItem('perinea-consent'); } catch (e) {}
    var v = c === 'grant' ? 'granted' : 'denied';
    gtag('consent', 'default', { ad_storage: v, ad_user_data: v, analytics_storage: v, ad_personalization: 'denied' });
  </script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-XXXXXXXXXX"></script>
  <script>
    gtag('js', new Date());
    gtag('config', 'AW-XXXXXXXXXX', { allow_ad_personalization_signals: false });
    // Conversion « Achat programme » : transaction_id évite de compter deux fois un rechargement de page.
    var sid = new URLSearchParams(location.search).get('session_id');
    if (sid) {
      gtag('event', 'conversion', {
        send_to: 'AW-XXXXXXXXXX/PPPPPPPPPPPPPPPPPPP',
        value: 2995, currency: 'CAD', transaction_id: sid
      });
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap top__in">
      <a href="index.html" class="logo"><img class="logo__img" src="logo-perinea.webp" alt="Périnéa" width="640" height="640"></a>
    </div>
  </header>
  <main class="thanks">
    <div class="wrap">
      <span class="headset"><svg viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9"/></svg></span>
      <h1>Bienvenue dans <em>le programme Périnéa&nbsp;!</em></h1>
      <p>Votre paiement est confirmé. Stripe vous envoie votre reçu par courriel.</p>
      <p>Prochaine étape&nbsp;: <span class="todo">[livraison des appareils sous X jours ouvrables + premier contact de l'équipe pour planifier vos séances]</span></p>
      <p>Une question&nbsp;? <a href="tel:+1XXXXXXXXXX"><span class="todo">1 XXX XXX-XXXX</span></a></p>
    </div>
  </main>
</body>
</html>
